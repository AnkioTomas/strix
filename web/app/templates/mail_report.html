<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f5f9;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="640" cellpadding="0" cellspacing="0" style="width:640px;max-width:100%;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(15,23,42,.08);">

  <tr><td style="background:{{accent}};padding:28px 32px;color:#ffffff;">
    <div style="font-size:13px;letter-spacing:2px;opacity:.85;">SECURITY ASSESSMENT REPORT</div>
    <div style="font-size:24px;font-weight:700;margin-top:6px;line-height:1.35;">{{title}}</div>
    <div style="font-size:14px;margin-top:10px;opacity:.95;">{{headline}}</div>
  </td></tr>

  <tr><td style="padding:24px 32px 8px 32px;">
    <div style="font-size:15px;line-height:1.7;">您好，</div>
    <div style="font-size:15px;line-height:1.7;margin-top:4px;">{{intro}}</div>
  </td></tr>

  <tr><td style="padding:16px 32px 0 32px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e5e7eb;border-radius:8px;font-size:14px;">
      {{info_rows}}
    </table>
  </td></tr>

  <tr><td style="padding:24px 32px 0 32px;">
    <div style="font-size:16px;font-weight:700;margin-bottom:12px;">漏洞分布<span style="font-weight:400;color:#6b7280;font-size:13px;">（共 {{total}} 个）</span></div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="6" style="border-collapse:separate;">
      <tr>{{severity_cards}}</tr>
    </table>
  </td></tr>

  {{serious_section}}

  <tr><td style="padding:24px 32px 8px 32px;">
    <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.7;color:#475569;">
      <b>附件</b>：中文测试报告（ZIP，含报告正文与截图证据）。<br>
      {{advice}}
    </div>
  </td></tr>

  <tr><td style="padding:20px 32px 28px 32px;font-size:12px;color:#94a3b8;line-height:1.7;border-top:1px solid #f1f5f9;">
    此邮件由安全测试平台自动发送，请勿直接回复。<br>
    任务编号：{{task_id}} · 生成时间：{{generated_at}}
  </td></tr>

</table>
</td></tr>
</table>
</body>
</html>
