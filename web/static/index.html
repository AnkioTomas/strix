<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <button type="button" class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="切换侧栏">☰</button>
        <span class="brand-mark">Strix</span>
        <span class="brand-sub">Local Security API</span>
      </div>
      <div class="topbar-status" id="admissionHint">准入：…</div>
      <div class="topbar-auth">
        <input id="apiKey" type="password" placeholder="API Token" autocomplete="off" />
        <button type="button" class="btn" id="saveKey">记住</button>
        <button type="button" class="btn ghost" id="clearSession">清除会话</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <h2>任务</h2>
        <button type="button" class="btn" id="newTaskBtn">新建</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
    </aside>

    <main class="main">
      <section class="panel create-panel hidden" id="createPanel">
        <h2>新建任务</h2>
        <div class="form-grid">
          <label>类型
            <select id="taskType">
              <option value="pentest">pentest</option>
              <option value="audit">audit</option>
            </select>
          </label>
          <label>Scan mode
            <select id="scanMode">
              <option value="quick">quick</option>
              <option value="standard" selected>standard</option>
              <option value="deep">deep</option>
            </select>
          </label>
          <label id="pentestFields" class="span-2">Target
            <input id="target" placeholder="https://example.com" />
          </label>
          <div id="auditFields" class="span-2 hidden">
            <label>Git HTTPS URL
              <input id="gitUrl" placeholder="https://github.com/org/repo.git" />
            </label>
            <label>Branch
              <input id="gitBranch" placeholder="main" />
            </label>
          </div>
          <label class="span-2">Instruction
            <textarea id="instruction" placeholder="重点测试 IDOR / SQL Injection …"></textarea>
          </label>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="createTask">创建</button>
          <button type="button" class="btn ghost" id="cancelCreate">取消</button>
        </div>
      </section>

      <section class="panel empty-state" id="emptyState">
        <h2>选择或新建任务</h2>
        <p>左侧列表选中任务后，可查看 Live Viewer、对话、漏洞、报告与工件。</p>
      </section>

      <section class="panel detail-panel hidden" id="detailPanel">
        <div class="detail-head">
          <div>
            <div class="detail-id" id="selectedId">—</div>
            <div class="detail-meta" id="selectedMeta"></div>
          </div>
          <div class="actions wrap">
            <button type="button" class="btn ghost" id="retryBtn">重试</button>
            <button type="button" class="btn ghost" id="retestBtn">复测</button>
            <button type="button" class="btn danger" id="cancelBtn">取消</button>
            <button type="button" class="btn ghost" id="refreshAll">刷新</button>
          </div>
        </div>

        <nav class="tabs" id="tabs">
          <button type="button" class="tab active" data-tab="overview">概览</button>
          <button type="button" class="tab" data-tab="viewer">Live Viewer</button>
          <button type="button" class="tab" data-tab="chat">对话</button>
          <button type="button" class="tab" data-tab="findings">漏洞</button>
          <button type="button" class="tab" data-tab="report">报告</button>
          <button type="button" class="tab" data-tab="artifacts">工件</button>
        </nav>

        <div class="tab-pane active" id="tab-overview">
          <dl class="kv" id="overviewKv"></dl>
          <h3>事件</h3>
          <pre class="log" id="events">选择任务后显示事件…</pre>
        </div>

        <div class="tab-pane" id="tab-viewer">
          <div class="viewer-toolbar">
            <a id="viewerDirect" class="muted" href="#" target="_blank" rel="noopener">直连调试链接</a>
            <span class="muted" id="viewerHint"></span>
          </div>
          <iframe id="viewerFrame" class="viewer-frame" title="Strix Viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </div>

        <div class="tab-pane" id="tab-chat">
          <div class="chat-log" id="chatLog"></div>
          <div class="chat-compose">
            <textarea id="message" placeholder="给 Agent 的消息（运行中实时投递；结束后会开 follow-up）"></textarea>
            <button type="button" class="btn" id="sendMsg">发送</button>
          </div>
        </div>

        <div class="tab-pane" id="tab-findings">
          <table class="data">
            <thead>
              <tr><th>严重性</th><th>标题</th><th>资产</th><th>位置</th></tr>
            </thead>
            <tbody id="findingsBody"></tbody>
          </table>
        </div>

        <div class="tab-pane" id="tab-report">
          <div class="actions">
            <button type="button" class="btn ghost" id="downloadReport">下载 Markdown</button>
          </div>
          <article class="report-md" id="reportView"></article>
        </div>

        <div class="tab-pane" id="tab-artifacts">
          <table class="data">
            <thead>
              <tr><th>名称</th><th>路径</th><th>大小</th><th></th></tr>
            </thead>
            <tbody id="artifactsBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
